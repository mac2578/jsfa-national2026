<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第6回ソーシャルフットボール全国大会 スケジュール＆対戦表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0ecff;--card:#fff;--ink:#1d1b3a;--line:#1d1b3a;--pink:#ff4f9a;--blue:#8ab4ff;--mint:#2fe0b0;--yel:#ffd23f;--org:#ff9a4d;--dot:#d9d1ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142e;--card:#272250;--ink:#f6f2ff;--line:#f6f2ff;--dot:#2a2556}}
:root[data-theme="dark"]{--bg:#17142e;--card:#272250;--ink:#f6f2ff;--line:#f6f2ff;--dot:#2a2556}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px;color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 60px}
h1,h2,.disp{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400}
.hero{background:var(--yel);color:#1d1b3a;border:3px solid var(--line);border-radius:28px;box-shadow:6px 6px 0 var(--line);padding:22px 20px 20px;position:relative;overflow:hidden;transform:rotate(-1deg)}
.hero small{display:inline-block;background:#1d1b3a;color:#fff;border-radius:99px;padding:2px 12px;font-weight:800;font-size:13px}
.hero h1{margin:8px 0 6px;font-size:clamp(26px,6.5vw,46px);line-height:1.15;color:var(--blue);-webkit-text-stroke:2px #1d1b3a;paint-order:stroke fill;text-shadow:3px 3px 0 #1d1b3a}
.hero h1 span{display:block;font-size:.55em}
.hero .ball{position:absolute;right:-14px;top:-16px;font-size:90px;transform:rotate(18deg);opacity:.9}
.dates{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dates b{background:#fff;border:2.5px solid #1d1b3a;border-radius:14px;padding:2px 12px;font-weight:800}
.note{font-size:12px;margin:14px 4px 4px;opacity:.85}
nav{display:flex;gap:8px;margin:20px 0 14px;overflow-x:auto;padding:4px 4px 10px}
nav button{font:inherit;font-weight:800;font-size:15px;white-space:nowrap;cursor:pointer;color:#1d1b3a;background:#fff;border:3px solid var(--line);border-radius:99px;padding:8px 16px;box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
nav button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
nav button[aria-selected="true"]{background:var(--pink)}
nav button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
section[hidden]{display:none}
h2{font-size:22px;margin:24px 0 10px;display:inline-block;background:var(--mint);color:#1d1b3a;border:3px solid var(--line);border-radius:14px;padding:2px 14px;box-shadow:3px 3px 0 var(--line);transform:rotate(-1.5deg)}
.heads,.row{display:grid;grid-template-columns:58px 1fr 1fr;gap:8px;margin-bottom:8px;align-items:stretch}
.heads div{font-weight:800;font-size:12px;text-align:center;border:3px solid var(--line);border-radius:14px;padding:5px 4px;color:#1d1b3a;line-height:1.3}
.heads small{display:block;font-weight:500;font-size:10px}
.ha{background:var(--pink)}.hb{background:var(--blue)}
.lab{font-size:11px;font-weight:800;writing-mode:vertical-rl;text-orientation:upright;background:var(--card);border:2.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;letter-spacing:1px;padding:4px 0}
.band{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;margin-bottom:8px;box-shadow:3px 3px 0 var(--line);font-weight:800}
.band .t{font-family:"Dela Gothic One",sans-serif;font-weight:400;background:#1d1b3a;color:#fff;border-radius:10px;padding:0 9px;font-size:15px}
.band .s{font-weight:500;font-size:12px;opacity:.8;margin-left:auto;text-align:right}
.band.party{background:var(--org);color:#1d1b3a}
.band.party .s{opacity:1}
.m{border:3px solid var(--line);border-radius:18px;padding:8px 8px 10px;box-shadow:4px 4px 0 var(--line);color:#1d1b3a;text-align:center;min-width:0}
.m .top{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;margin-bottom:4px}
.tm{font-family:"Dela Gothic One",sans-serif;font-size:15px}
.tag{background:#1d1b3a;color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:0 9px}
.tn{font-weight:800;font-size:13px;line-height:1.3;background:#ffffffcc;border-radius:10px;padding:3px 4px;overflow-wrap:anywhere}
.vs{font-family:"Dela Gothic One",sans-serif;font-size:11px;margin:2px 0;color:#1d1b3a}
.cA{background:var(--pink)}.cB{background:var(--blue)}.cC{background:var(--mint)}.cK{background:var(--yel)}.cJ{background:var(--org)}
.empty{border:2.5px dashed var(--line);border-radius:18px;opacity:.25}
/* groups */
.grp{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--line);margin:0 0 20px;overflow:hidden}
.grp h3{margin:0;padding:8px 16px;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:20px;color:#1d1b3a;border-bottom:3px solid var(--line)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:430px;font-size:13px}
th,td{border:2px solid var(--line);padding:6px;text-align:center;font-weight:800}
th{background:#ffffff40;font-size:12px}
td.x{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--dot) 6px 9px)}
td.nm{text-align:left;min-width:130px}
td[contenteditable]{min-width:46px;cursor:text}
td[contenteditable]:focus{outline:3px solid var(--yel);outline-offset:-3px;background:#ffd23f55}
.hint{font-size:12px;margin:0 4px 14px;opacity:.8}
.ml{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px}
.ml .m{box-shadow:3px 3px 0 var(--line)}
/* bracket */
.br{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.col h4{margin:0;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:14px;text-align:center}
.seed{border:3px dashed var(--line);border-radius:14px;padding:6px;text-align:center;font-weight:800;font-size:13px;background:var(--card)}
.seed small{display:block;font-size:10px;font-weight:500;opacity:.8}
.go{font-size:11px;font-weight:800;margin-top:4px}
.final{transform:scale(1.04)}
.final .tn{font-size:14px}
.crown{font-size:44px;text-align:center;filter:drop-shadow(3px 3px 0 var(--line))}
.below{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:520px){.br{grid-template-columns:1fr}.below{grid-template-columns:1fr}.hero .ball{font-size:64px}}
@media (prefers-reduced-motion:no-preference){.ball{animation:bob 2.6s ease-in-out infinite}}
@keyframes bob{50%{transform:rotate(18deg) translateY(8px)}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<span class="ball" aria-hidden="true">⚽</span>
<small>大会スケジュール＆対戦表</small>
<h1><span>第6回</span>ソーシャルフットボール<br>全国大会</h1>
<div class="dates"><b>1日目 11/21</b><b>2日目 11/22</b></div>
</header>
<p class="note">※スケジュールは予定です。変更となる場合がありますので、あらかじめご了承ください。</p>

<nav role="tablist" aria-label="表示切り替え">
<button role="tab" aria-selected="true" data-v="lg">予選リーグ</button>
<button role="tab" aria-selected="false" data-v="d1">1日目 11/21</button>
<button role="tab" aria-selected="false" data-v="d2">2日目 11/22</button>
</nav>

<section id="lg"></section>
<section id="d1" hidden></section>
<section id="d2" hidden></section>
</div>

<script>
const T={A:['トラム―ト北九州','リガ―レヴィア葛飾VISTACHIO','INTERVALO大阪'],B:['shikoku select','エストレージャあいち','BOSCO NEXT'],C:['ヴィンセドールルミナス','YARIMASSE大阪','FC PORT']};
const PAIR=[[0,1],[1,2],[0,2]];
const e=s=>s;
function mc(t,tag,cls,n1,n2,extra){return `<div class="m ${cls}"><div class="top"><span class="tm">${t}</span><span class="tag">${tag}</span></div><div class="tn">${n1}</div><div class="vs">VS</div><div class="tn">${n2}</div>${extra?`<div class="go">${extra}</div>`:''}</div>`}
function gm(g,i,t){const p=PAIR[i];return mc(t,g+'①②③'[i],'c'+g,T[g][p[0]],T[g][p[1]])}
function band(t,k,s,cls){return `<div class="band ${cls||''}"><span class="t">${t}</span><span>${k}</span><span class="s">${s||''}</span></div>`}
function row(l,a,b){return `<div class="row"><div class="lab">${l}</div>${a||'<div class="empty"></div>'}${b||'<div class="empty"></div>'}</div>`}
const heads=`<div class="heads"><div></div><div class="ha">Aコート<small>入口より手前</small></div><div class="hb">Bコート<small>入口より奥側</small></div></div>`;
const K=(t,tag,a,b,x)=>mc(t,tag,'cK',a,b,x), J=(t,tag,a,b)=>mc(t,tag,'cJ',a,b);

document.getElementById('d1').innerHTML=
band('8:30','開場')+band('9:00','オープニング','オープニングセレモニー＠Aコート')+heads+
row('予選リーグ',gm('A',0,'10:00'),gm('B',0,'10:00'))+
row('予選リーグ',gm('C',0,'11:00'))+
row('予選リーグ',gm('A',1,'12:00'),gm('B',1,'12:00'))+
row('予選リーグ',gm('C',1,'13:00'))+
row('予選リーグ',gm('A',2,'14:00'),gm('B',2,'14:00'))+
row('予選リーグ',gm('C',2,'15:00'))+
row('決勝T 1回戦',K('17:00','決①','2位G-1位','2位G-2位','勝者 → 決③'),K('16:30','決②','1位G-3位','2位G-3位','勝者 → 決④'))+
band('18:15','全試合終了')+band('19:00','閉場');

document.getElementById('d2').innerHTML=
band('8:30','開場')+heads+
row('準決勝／順位L',K('9:30','決③','1位G-1位','決①の勝者','勝者 → 決⑦'),J('9:30','順L①','3位G-1位','3位G-2位'))+
row('準決勝／順位L',K('10:45','決④','決②の勝者','1位G-2位','勝者 → 決⑦'),J('10:30','順L②','3位G-2位','3位G-3位'))+
row('順位L',null,J('11:30','順L③','3位G-1位','3位G-3位'))+
row('3位決・5位決',K('12:30','決⑥ 3位決','決③の敗者','決④の敗者'),K('12:30','決⑤ 5位決','決①の敗者','決②の敗者'))+
row('決勝戦',K('14:00','決⑦ 決勝','決③の勝者','決④の勝者'))+
band('15:45','閉会式','閉会式／表彰式＠Aコート')+band('16:30','閉会式終了')+
band('17:00','後夜祭','＠宿泊棟レストラン','party')+band('18:00','後夜祭（中締め）','','party')+band('18:30','後夜祭終了','','party')+
band('19:00','終了／解散','解散／片付け');

function table(g){const n=T[g];let h=`<div class="grp"><h3 class="c${g}">Group ${g}</h3><div class="scroll"><table><tr><th></th>${n.map(x=>`<th>${x}</th>`).join('')}<th>勝点</th><th>得失</th><th>順位</th></tr>`;
n.forEach((x,i)=>{h+=`<tr><td class="nm">${x}</td>`;n.forEach((y,j)=>{if(i==j)h+='<td class="x"></td>';else{const k=PAIR.findIndex(p=>(p[0]==i&&p[1]==j)||(p[0]==j&&p[1]==i));h+=`<td>${'①②③'[k]}</td>`}});h+='<td contenteditable="true" aria-label="勝点"></td><td contenteditable="true" aria-label="得失"></td><td contenteditable="true" aria-label="順位"></td></tr>'});
h+=`</table></div><div class="ml">${[0,1,2].map(i=>{const p=PAIR[i];return mc('','①②③'[i],'c'+g,n[p[0]],n[p[1]])}).join('')}</div></div>`;return h}
document.getElementById('lg').innerHTML='<h2>予選リーグ</h2><p class="hint">勝点・得失・順位のマスはタップして入力できます。</p>'+table('A')+table('B')+table('C')+
`<h2>7〜9位リーグ</h2><div class="grp"><h3 class="cJ">3位グループ</h3><div class="scroll"><table><tr><th></th><th>3位G-1位</th><th>3位G-2位</th><th>3位G-3位</th><th>勝点</th><th>得失</th><th>順位</th></tr>`+
['3位G-1位','3位G-2位','3位G-3位'].map((x,i)=>`<tr><td class="nm">${x}</td>${[0,1,2].map(j=>i==j?'<td class="x"></td>':`<td>${'①②③'[PAIR.findIndex(p=>(p[0]==i&&p[1]==j)||(p[0]==j&&p[1]==i))]}</td>`).join('')}<td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>`).join('')+`</table></div></div>`;

const tabs=[...document.querySelectorAll('nav button')];
tabs.forEach(b=>b.addEventListener('click',()=>{tabs.forEach(x=>x.setAttribute('aria-selected',x===b));
document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.v);window.scrollTo({top:0})}));
</script>
</body>
</html>
